services:
  mongo:
    image: mongo:7
    container_name: lead-tracker-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./server
    container_name: lead-tracker-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
      MONGODB_URI: mongodb://mongo:27017/lead_tracker
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - full

volumes:
  mongo-data:
